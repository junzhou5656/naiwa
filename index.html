<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>爱奶娃漂流打卡牌 · 维护中</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #FFF8E7;
      color: #333;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
      text-align: center;
    }
    .box {
      background: #fff;
      border-radius: 24px;
      padding: 40px 25px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      border: 2px dashed #FFD54F;
    }
    .icon {
      font-size: 48px;
      margin-bottom: 15px;
    }
    h1 {
      font-size: 22px;
      color: #E65100;
      margin-bottom: 15px;
    }
    p {
      font-size: 15px;
      color: #666;
      line-height: 1.8;
      margin-bottom: 10px;
    }
    .small {
      font-size: 12px;
      color: #999;
      margin-top: 20px;
      border-top: 1px solid #eee;
      padding-top: 15px;
    }
    .contact {
      font-size: 13px;
      color: #E65100;
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">🐣</div>
    <h1>奶娃正在休息中</h1>
    <p>“爱奶娃漂流打卡牌”正在进行系统维护。</p>
    <p>暂时无法打卡和留言，请大家多多谅解。</p>
    <div class="contact">
      如有疑问请联系：<br>
      周奶娃（微信号：fg_8900）
    </div>
    <div class="small">
      维护结束后会第一时间恢复，请耐心等待。
    </div>
  </div>
</body>
</html>
